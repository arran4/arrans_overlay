name: Temporary Dart 3.14 DEPS review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-dart-314-deps-smoke.yml'
      - 'scripts/generate_dart_ebuild.py'
      - 'scripts/test_generate_dart_ebuild.py'
jobs:
  reviewed-source-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render authoritative Dart 3.14 source DEPS without publishing
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import generate_dart_ebuild as generator
          generator.DART_VERSION = "3.14.0"
          generator.BOOTSTRAP_SDK_TAG = generator.bootstrap_for_version("3.14.0")[0]
          generator.SDK_DEPS_URL = "https://raw.githubusercontent.com/dart-lang/sdk/3.14.0/DEPS"
          path, temporary = generator.obtain_deps(None)
          try:
              output = generator.render(path)
              assert "BEGIN GENERATED DART DEPS" in output
              print("Dart 3.14.0 full reviewed DEPS graph rendered")
          finally:
              if temporary is not None:
                  temporary.cleanup()
          PY
