name: Flutter Engine Dart Pin Regression

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter stable release to audit
        required: true
        type: string
      expected_dart_revision:
        description: Optional expected 40-character Dart Git SHA
        required: false
        type: string
      full_render:
        description: Also require full target Engine DEPS render to succeed
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      # Dart/Flutter SDK packaging, including ebuilds, Manifests and files/.
      - 'dev-libs/flutter-engine/**'
      - 'dev-lang/flutter/**'
      - 'dev-lang/flutter-bin/**'
      - 'dev-lang/dart/**'
      - 'dev-lang/dart-bin/**'
      - 'virtual/dart/**'
      - 'virtual/flutter/**'
      # The generators, update orchestration and their regression tests.
      - 'scripts/generate_flutter_ebuild.py'
      - 'scripts/flutter_release_spec.py'
      - 'scripts/update_dart_source.py'
      - 'scripts/source_update_utils.py'
      - '.github/workflows/dev-libs-flutter-engine-source-test.yaml'
      - '.github/workflows/dev-lang-flutter-source-update.yaml'
      - 'scripts/generate_flutter_engine_ebuild.py'
      - 'scripts/check_flutter_engine_dart_pins.py'
      - 'scripts/test_generate_flutter_engine_ebuild.py'
      - 'scripts/test_flutter_release_pipeline.py'
      - 'scripts/update_flutter_source.py'
      - '.github/workflows/flutter-engine-dart-pin-regression.yaml'

concurrency:
  group: flutter-engine-dart-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-release:
    name: Select actual Flutter release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.select.outputs.version }}
      ebuild: ${{ steps.select.outputs.ebuild }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: select
        env:
          REQUESTED_VERSION: ${{ inputs.flutter_version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            base_version="${REQUESTED_VERSION%-r*}"
            version="$base_version"
            candidate="dev-lang/flutter/flutter-${REQUESTED_VERSION}.ebuild"
            if [[ -f "$candidate" ]]; then
              ebuild="$candidate"
            elif [[ -f "dev-lang/flutter/flutter-${base_version}.ebuild" ]]; then
              ebuild="dev-lang/flutter/flutter-${base_version}.ebuild"
            else
              ebuild=""
            fi
          else
            mapfile -t changed < <(
              git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
                'dev-lang/flutter/flutter-*.ebuild' |
                sed -nE 's#^dev-lang/flutter/flutter-([0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?)\.ebuild$#\1#p'
            )
            if (( ${#changed[@]} == 1 )); then
              full_ver="${changed[0]}"
              version="${full_ver%-r*}"
              ebuild="dev-lang/flutter/flutter-${full_ver}.ebuild"
            elif (( ${#changed[@]} > 1 )); then
              echo "multiple Flutter source releases changed; dispatch with flutter_version" >&2
              exit 1
            else
              version="$({
                for path in dev-lang/flutter/flutter-*.ebuild; do
                  candidate="${path#dev-lang/flutter/flutter-}"
                  candidate="${candidate%.ebuild}"
                  base_candidate="${candidate%-r[0-9]*}"
                  for engine_path in "dev-libs/flutter-engine/flutter-engine-${base_candidate}"*.ebuild; do
                    [[ -f "$engine_path" ]] && printf '%s\n' "$base_candidate"
                  done
                done
              } | sort -V | tail -n1)"
              [[ -n "$version" ]] || {
                echo "no matching Flutter/Engine source release exists" >&2
                exit 1
              }
              ebuild=""
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ebuild=$ebuild" >> "$GITHUB_OUTPUT"

  validate-target-dart-pins:
    name: Validate upstream Dart pin and isolation
    needs: select-release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify real DEPS pins and consecutive renders
        env:
          FLUTTER_VERSION: ${{ needs.select-release.outputs.version }}
          FLUTTER_EBUILD: ${{ needs.select-release.outputs.ebuild }}
          EXPECTED_DART_REVISION: ${{ inputs.expected_dart_revision || '' }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--version "$FLUTTER_VERSION")
          if [[ -n "$FLUTTER_EBUILD" ]]; then
            arguments+=(--ebuild "$FLUTTER_EBUILD")
          fi
          if [[ -n "$EXPECTED_DART_REVISION" ]]; then
            arguments+=(--expected-dart-revision "$EXPECTED_DART_REVISION")
          fi
          python3 scripts/check_flutter_engine_dart_pins.py "${arguments[@]}"

  full-release-render-audit:
    name: Strict full upstream DEPS render (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.full_render == true
    needs: [select-release, validate-target-dart-pins]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Render complete selected Engine DEPS, fail on unreviewed changes
        env:
          FLUTTER_VERSION: ${{ needs.select-release.outputs.version }}
          EXPECTED_DART_REVISION: ${{ inputs.expected_dart_revision || '' }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--version "$FLUTTER_VERSION" --full-render)
          if [[ -n "$EXPECTED_DART_REVISION" ]]; then
            arguments+=(--expected-dart-revision "$EXPECTED_DART_REVISION")
          fi
          python3 scripts/check_flutter_engine_dart_pins.py "${arguments[@]}"
