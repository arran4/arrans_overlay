# Generated using: https://github.com/arran4/arrans_overlay_workflow_builder dev Github AppImage Release current.config 2026-10-30 11:55:05.754126386 +0000 UTC m=+0.024522767

name: app-misc/maid-appimage update

permissions:
  contents: write

on:
  schedule:
    - cron: '51 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/app-misc-maid-appimage-update.yaml'

env:
  ecn: app-misc
  epn: maid-appimage
  description: "Maid is a cross-platform Flutter app for interfacing with GGUF / llama.cpp models locally, and with Ollama and OpenAI models remotely."
  homepage: ""
  github_owner: Mobile-Artificial-Intelligence
  github_repo: maid
  keywords: ~amd64
  workflow_filename: app-misc-maid-appimage-update.yaml
  maid_desktop_file: 'maid.desktop'
  maid_appimage_installed_name: 'maid.AppImage'
  maid_release_name_amd64: 'maid.AppImage'

concurrency:
  group: ci-${{ github.workflow_ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Process each release
        id: process_releases
        env:
          DESCRIPTION: "Maid is a cross-platform Flutter app for interfacing with GGUF / llama.cpp models locally, and with Ollama and OpenAI models remotely."
          HOMEPAGE: ""
          LICENSE: "MIT License"
          KEYWORDS: "~amd64"
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          mkdir -p "$ebuild_dir"
          metadata_file="${ebuild_dir}/metadata.xml"
          g2 metadata -m "gentoo@arran4.com:Arran Ubels:person" -u "github:Mobile-Artificial-Intelligence/maid" "$metadata_file"
          declare -A releaseTypes=()
          tags=$(GH_TOKEN="${{secrets.GITHUB_TOKEN}}" gh api "repos/${{ env.github_owner }}/${{ env.github_repo }}/releases" --jq '.[]? | select(type=="object" and has("tag_name")) | .tag_name')
          # shellcheck disable=SC2086
          for tag in $tags; do
            version="${tag}"
            # shellcheck disable=SC2034
            originalVersion="${version}"
            if ! echo "${version}" | grep -E '^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-r[0-9]+)?((_)(alpha|beta|rc|p)[0-9]*)*$'; then
                echo "version: $version doesn't match regexp"
                continue
            fi
            # shellcheck disable=SC2001
            releaseType="$(echo "${version}" | sed -n 's/^[^_]\+_\(alpha\|beta\|rc\|p[0-9]*\).*$/\1/p')"
            if [[ ! -v releaseTypes[${releaseType:=release}] ]]; then
                releaseTypes[${releaseType:=release}]="$version"
            else
                echo "Already have a newier ${releaseType:=release} release: ${releaseTypes[${releaseType:=release}]}"
                continue
            fi
            tmp_ebuild_file="${ebuild_dir}/${{ env.epn }}-${version}.ebuild.tmp"

              # shellcheck disable=SC2016
              {
                printf '%s\n' '# SPDX-License-Identifier: MIT'
                emit_metadata_field() {
                    local label=$1
                    local value=$2
                    local prefix="${label}+=\""
                    local max_chunk=$((80 - ${#prefix} - 1))
                    echo "${label}=\"\""
                    [ -z "$value" ] && return 0
                    local clean_value="${value//$'\r'/}"
                    clean_value="${clean_value//$'\n'/ }"
                    local tokens=()
                    local len=${#clean_value}
                    local i=0
                    while [ $i -lt $len ]; do
                        if [ "${clean_value:i:4}" = "\${P}" ]; then
                            tokens+=("\${P}")
                            i=$((i + 4))
                        elif [ "${clean_value:i:5}" = "\${PV}" ]; then
                            tokens+=("\${PV}")
                            i=$((i + 5))
                        elif [ "${clean_value:i:5}" = "\${PN}" ]; then
                            tokens+=("\${PN}")
                            i=$((i + 5))
                        elif [ "${clean_value:i:9}" = "\${DEPEND}" ]; then
                            tokens+=("\${DEPEND}")
                            i=$((i + 9))
                        else
                            local c="${clean_value:i:1}"
                            case "$c" in
                                \"|\\|\`|\$)
                                    tokens+=("\\$c")
                                    ;;
                                *)
                                    tokens+=("$c")
                                    ;;
                            esac
                            i=$((i + 1))
                        fi
                    done
                    local current_line=""
                    local pending_after_space=""
                    for tok in "${tokens[@]}"; do
                        if [ $((${#current_line} + ${#pending_after_space} + ${#tok})) -le $max_chunk ]; then
                            if [ "$tok" = " " ]; then
                                current_line="${current_line}${pending_after_space} "
                                pending_after_space=""
                            else
                                pending_after_space="${pending_after_space}${tok}"
                            fi
                        else
                            if [ -n "$current_line" ]; then
                                printf "%s%s\"\n" "$prefix" "$current_line"
                                current_line=""
                                if [ $((${#pending_after_space} + ${#tok})) -le $max_chunk ]; then
                                    if [ "$tok" = " " ]; then
                                        current_line="${pending_after_space} "
                                        pending_after_space=""
                                    else
                                        pending_after_space="${pending_after_space}${tok}"
                                    fi
                                else
                                    if [ -n "$pending_after_space" ]; then
                                        printf "%s%s\"\n" "$prefix" "$pending_after_space"
                                    fi
                                    if [ "$tok" = " " ]; then
                                        current_line=" "
                                        pending_after_space=""
                                    else
                                        pending_after_space="$tok"
                                    fi
                                fi
                            else
                                if [ -n "$pending_after_space" ]; then
                                    printf "%s%s\"\n" "$prefix" "$pending_after_space"
                                fi
                                if [ "$tok" = " " ]; then
                                    current_line=" "
                                    pending_after_space=""
                                else
                                    pending_after_space="$tok"
                                fi
                            fi
                        fi
                    done
                    local final="${current_line}${pending_after_space}"
                    if [ -n "$final" ]; then
                        printf "%s%s\"\n" "$prefix" "$final"
                    fi
                }
                emit_ebuild_assignment() {
                    emit_metadata_field "$@"
                }
                # Shell helper to wrap provenance fields at exactly 80 chars
                emit_provenance_field() {
                    local label=$1
                    local value=$2
                    local prefix="#   ${label}: "
                    local continuation
                    local width
                    printf -v continuation '%*s' "${#prefix}" ''
                    continuation="#${continuation:1}"
                    while :; do
                        width=$((80 - ${#prefix}))
                        if ((${#value} <= width)); then
                            printf '%s%s\n' "$prefix" "$value"
                            break
                        fi
                        printf '%s%s\n' "$prefix" "${value:0:width}"
                        value=${value:width}
                        prefix=$continuation
                    done
                }
                echo '# Generated via:'
                emit_provenance_field "repository" "${{ github.server_url }}/${{ github.repository }}"
                emit_provenance_field "commit" "${{ github.sha }}"
                emit_provenance_field "workflow" ".github/workflows/${{ env.workflow_filename }}"
                echo 'EAPI=8'
                emit_metadata_field "DESCRIPTION" "$DESCRIPTION"
                emit_metadata_field "HOMEPAGE" "$HOMEPAGE"
                emit_metadata_field "LICENSE" "$LICENSE"
                echo 'SLOT="0"'
                emit_metadata_field "KEYWORDS" "$KEYWORDS"
                echo 'IUSE=""'
                echo 'DEPEND=""'
                rdepend_val="sys-fs/fuse:0 sys-libs/glibc sys-libs/zlib"
                emit_metadata_field "RDEPEND" "$rdepend_val"
                echo 'S="${WORKDIR}"'
                echo 'RESTRICT="strip"'
                echo ''
                echo "inherit xdg-utils"
                echo ''
                src_uri_val=""
                src_uri_val+=" amd64? ( "
                src_uri_val+=" https://github.com/${{ env.github_owner }}/${{ env.github_repo }}/releases/download/${tag}/maid.AppImage "
                src_uri_val+=" -> \${P}-maid.AppImage ) "
                emit_metadata_field "SRC_URI" "$src_uri_val"
                echo ''
                echo 'src_unpack() {'
                echo '	if use amd64; then'
                echo "		cp \\"
                echo "			\"\${DISTDIR}/\${P}-${{ env.maid_release_name_amd64 }}\" \\"
                echo "			\"${{ env.maid_appimage_installed_name }}\" || die \"Failed to copy downloaded file\""
                echo '	fi'
                echo '	chmod a+x "${{ env.maid_appimage_installed_name }}"  || die "Can'\''t chmod archive file"'
                echo '	"./${{ env.maid_appimage_installed_name }}" --appimage-extract "${{ env.maid_desktop_file }}" || die "Failed to extract .desktop from appimage"'
                echo '	"./${{ env.maid_appimage_installed_name }}" --appimage-extract "*.png" || die "Failed to extract root icons from app image"'
                echo '}'
                echo ''
                echo 'src_prepare() {'
                echo "	sed -i 's:^Exec=.*:Exec=/opt/bin/${{ env.maid_appimage_installed_name }}:' 'squashfs-root/${{ env.maid_desktop_file }}'"
                echo '	eapply_user'
                echo '}'
                echo ''
                echo 'src_install() {'
                echo '	exeinto /opt/bin'
                echo '	doexe "${{ env.maid_appimage_installed_name }}" || die "Failed to install AppImage"'
                echo '	insinto /usr/share/applications'
                echo '	doins "squashfs-root/${{ env.maid_desktop_file }}" || die "Failed to install desktop file"'
                echo '	insinto /usr/share/pixmaps'
                echo '	doins squashfs-root/*.png || die "Failed to install icons"'
                echo '}'
                echo ""
                echo "pkg_postinst() {"
                echo "	xdg_desktop_database_update"
                echo "}"
                echo ""

              } > "$tmp_ebuild_file"
              if next_version=$(g2 ebuild next-revision --inspect "$tmp_ebuild_file" "${ebuild_dir}" "${version}"); then
                  next_ebuild_file="${ebuild_dir}/${{ env.epn }}-${next_version}.ebuild"
                  echo "Content changed or new version for $version. Writing $next_ebuild_file"
                  mv "$tmp_ebuild_file" "$next_ebuild_file"
                  ebuild_file="$next_ebuild_file"
              else
                  echo "Matches existing ebuild. Skipping."
                  rm -f "$tmp_ebuild_file"
                  continue
              fi
              failed=0
              if ! g2 manifest upsert-from-url "https://github.com/${{ env.github_owner }}/${{ env.github_repo }}/releases/download/${tag}/maid.AppImage" "${{ env.epn }}-${version}-maid.AppImage" "${ebuild_dir}/Manifest"; then failed=1; fi
              if [ "$failed" -eq 1 ]; then
                  echo "Failed to generate manifest for $tag. Skipping..."
                  rm -f "$ebuild_file"
                  continue
              fi
              echo "generated_tag=${tag}" >> $GITHUB_OUTPUT
          done

      - name: Deduplicate ebuilds
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          g2 ebuild deduplicate "${ebuild_dir}"

      - name: Lint output
        if: steps.process_releases.outputs.generated_tag
        uses: arran4/g2-action@v1.2
        with:
          mode: 'run'
          action: 'lint -disable-rule PG0802 . ${{ env.ecn }}/${{ env.epn }}'

      - name: Commit and push changes
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          mkdir -p profiles metadata
          if [ -f profiles/repo_name ]; then
            :
          else
            echo "::warning title=Missing profiles/repo_name::profiles/repo_name is missing. Skipping creation because explicit upsert is not enabled."
          fi
          if [ ! -f profiles/eapi ]; then
            echo "8" > profiles/eapi
          fi
          if [ ! -f metadata/layout.conf ]; then
            wget -qO - https://raw.githubusercontent.com/gentoo/gentoo/master/metadata/layout.conf > metadata/layout.conf || true
          fi
          if ! grep -q "^cache-formats" metadata/layout.conf; then
            echo "cache-formats = md5-dict" >> metadata/layout.conf
          else
            echo "::warning title=Layout.conf check::cache-formats is already defined in layout.conf, skipping generation."
          fi
          g2 cache generate "${{ env.ecn }}/${{ env.epn }}"
          git add "./${ebuild_dir}"
          if git commit -m "Add ebuilds for new ${{ env.epn }} releases tag ${generated_tag}"; then
            git pull --rebase &&
            git push
          fi || true
        if: steps.process_releases.outputs.generated_tag
