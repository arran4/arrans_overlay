name: Verify original Lain upstream source (temporary)

on:
  push:
    branches:
      - pkg/re-lain-native-0.2.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download parent upstream source and print Manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Y0oshi/lain-psx-decompiled/archive/refs/tags/v0.2.0.tar.gz" \
            --output lain-psx-decompiled-0.2.0.tar.gz
          echo "----- GENTOO DIST -----"
          printf 'DIST lain-psx-decompiled-0.2.0.tar.gz %s BLAKE2B %s SHA512 %s\n' \
            "$(stat --format=%s lain-psx-decompiled-0.2.0.tar.gz)" \
            "$(b2sum lain-psx-decompiled-0.2.0.tar.gz | cut -d' ' -f1)" \
            "$(sha512sum lain-psx-decompiled-0.2.0.tar.gz | cut -d' ' -f1)"
          mkdir -p source
          tar xf lain-psx-decompiled-0.2.0.tar.gz -C source --strip-components=1
          test -f source/port/CMakeLists.txt
          test -f source/docs/assets/save-icon.svg
          test -f source/port/PORTING.md

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev libgl-dev cmake ninja-build

      - name: Build Linux client from parent release tag
        run: |
          cmake -S source/port -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAIN_STATIC_DEPS=OFF
          cmake --build build --parallel 2
          test -x build/lain
