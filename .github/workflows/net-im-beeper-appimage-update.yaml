# Manually maintained because overlay_workflow_builder_generator cannot handle version extraction from the non-standard filename correctly without arch.
name: net-im/beeper-appimage update

permissions:
  contents: write

on:
  schedule:
    - cron: '8 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/net-im-beeper-appimage-update.yaml'

env:
  ecn: net-im
  epn: beeper-appimage
  description: "Unified chat client bridging multiple networks"
  homepage: "https://www.beeper.com"
  keywords: ~amd64
  workflow_filename: net-im-beeper-appimage-update.yaml
  beeper_appimage_installed_name: 'beeper.AppImage'

jobs:
  fetch-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq coreutils
          wget -qO- https://github.com/mgdm/htmlq/releases/download/v0.4.0/htmlq-x86_64-linux.tar.gz | tar xz -C /usr/local/bin htmlq
      - name: Determine latest AppImage
        id: find_appimage
        run: |
          set -euo pipefail
          appimage_url="$(curl -sIL -o /dev/null -w '%{url_effective}' 'https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop')"
          if [ -z "$appimage_url" ]; then
            echo "failed to resolve AppImage redirect" >&2
            exit 1
          fi
          fname="$(basename "$appimage_url")"
          artifact_ext="${fname##*.}"
          if [ -z "$artifact_ext" ] || [ "$artifact_ext" = "$fname" ]; then
            echo "unable to determine artifact extension from $fname" >&2
            exit 1
          fi
          base_name="${fname%.*}"
          base_name_without_arch="${base_name%-x86_64}"
          version="${base_name_without_arch##*-}"
          echo "appimage_url=$appimage_url" >> "$GITHUB_ENV"
          echo "appimage_extension=$artifact_ext" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Update ebuild
        id: update_ebuild
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          mkdir -p "$ebuild_dir"
          metadata_file="${ebuild_dir}/metadata.xml"
          if [ ! -f "$metadata_file" ]; then
            cat <<-"EOF" > "$metadata_file"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE pkgmetadata SYSTEM "http://www.gentoo.org/dtd/metadata.dtd">
          <pkgmetadata></pkgmetadata>
          EOF
          fi
          gen_output=$(./scripts/generate_retained_ebuild.sh beeper-appimage "$ebuild_dir" "$version" \
            "$appimage_extension" "${{ env.beeper_appimage_installed_name }}" "$appimage_url")
          echo "$gen_output"
          if echo "$gen_output" | grep -q "^GENERATED:"; then
            g2 manifest upsert-from-url "$appimage_url" "${{ env.epn }}-${version}.${appimage_extension}" "${ebuild_dir}/Manifest"
            echo "generated_tag=${version}" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          git add "${ebuild_dir}"
          if git commit -m "Add ebuild for version ${version}"; then
            git pull --rebase &&
            git push
          fi || true
        if: steps.update_ebuild.outputs.generated_tag
