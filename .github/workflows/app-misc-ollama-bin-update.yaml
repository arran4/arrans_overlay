# Manually built because the complex ebuild logic (systemd, ROCM, library layout)
# is not currently supported by arrans_overlay_workflow_builder.
name: app-misc/ollama-bin update

permissions:
  contents: write

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/app-misc-ollama-bin-update.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ecn: app-misc
  epn: ollama-bin
  description: "Get up and running with Llama 3, Mistral, Gemma, and other LLMs"
  homepage: "https://ollama.com"
  github_owner: ollama
  github_repo: ollama

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq coreutils tar
      - name: Process each release
        id: process_releases
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          mkdir -p "$ebuild_dir"

          # Fetch only the latest non-prerelease tag. Do not mutate the package
          # directory until the replacement ebuild and Manifest are complete.
          tags=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{secrets.GITHUB_TOKEN}}" \
            https://api.github.com/repos/${{ env.github_owner }}/${{ env.github_repo }}/releases \
            | jq -r '[.[] | select(.prerelease==false)] | .[0].tag_name')

          if [ -z "$tags" ] || [ "$tags" = "null" ]; then
            echo "No stable release tag found"
            exit 1
          fi

          for tag in $tags; do
            version="${tag#v}"
            if [ "${version}" = "${tag}" ]; then
              # Skipping tag that doesn't start with 'v'
              continue
            fi

            # Keep original version for comparison
            orig_version="$version"

            # Gentoofy version
            version=$(echo "$version" | sed 's/-rc/_rc/g; s/-beta/_beta/g; s/-alpha/_alpha/g; s/-p/_p/g')

            if ! echo "$version" | egrep '^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-r[0-9]+)?((_)(alpha|beta|rc|p)[0-9]*)*$'; then
              echo "tag / $version doesn't match regexp";
              continue;
            fi

            ext="tgz"
            bdepend=""
            if dpkg --compare-versions "$orig_version" "ge" "0.14.0"; then
               ext="tar.zst"
               bdepend='BDEPEND="app-arch/zstd"'
            fi

            ebuild_file="${ebuild_dir}/${{ env.epn }}-${version}.ebuild"
            if [ ! -f "$ebuild_file" ]; then
              tmp_ebuild="${ebuild_file}.tmp"
              tmp_manifest_dir="${ebuild_dir}/Manifest.tmp"
              rm -f "$tmp_ebuild"
              rm -rf "$tmp_manifest_dir"
              mkdir -p "$tmp_manifest_dir"
              touch "$tmp_manifest_dir/Manifest"
              trap 'rm -f "$tmp_ebuild"; rm -rf "$tmp_manifest_dir"' EXIT

              {
                echo "# Copyright 2024-$(date +%Y) Arran Ubels"
                echo "# Distributed under the terms of the GNU General Public License v2"
                echo ""
                echo "# Generated via:"
                echo "# https://github.com/arran4/arrans_overlay/blob/main/.github/workflows/ \\"
                echo "# app-misc-ollama-bin-update.yaml"
                echo 'EAPI=8'
                echo "DESCRIPTION=\"${{ env.description }}\""
                echo "HOMEPAGE=\"${{ env.homepage }}\""
                echo 'MY_PV="${PV/_/-}"'
                echo 'SRC_URI="'
                echo -e '\tamd64? ('
                echo -e '\t\thttps://github.com/ollama/ollama/releases/download/v${MY_PV}/ollama-linux-amd64.'${ext}
                echo -e '\t\t\t-> ${P}.amd64.'${ext}
                echo -e '\t)'
                echo -e '\tarm64? ('
                echo -e '\t\thttps://github.com/ollama/ollama/releases/download/v${MY_PV}/ollama-linux-arm64.'${ext}
                echo -e '\t\t\t-> ${P}.arm64.'${ext}
                echo -e '\t)'
                echo -e '\trocm? ('
                echo -e '\t\thttps://github.com/ollama/ollama/releases/download/v${MY_PV}/ollama-linux-amd64-rocm.'${ext}
                echo -e '\t\t\t-> ${P}.rocm.'${ext}
                echo -e '\t)"'
                echo 'S="${WORKDIR}"'
                echo 'LICENSE="MIT"'
                echo 'SLOT="0"'
                echo 'KEYWORDS="~amd64 ~arm64"'
                echo 'IUSE="+systemd rocm"'
                echo 'RESTRICT="strip"'
                if [ -n "$bdepend" ]; then
                  echo "$bdepend"
                fi
                echo 'DEPEND="acct-user/ollama acct-group/ollama"'
                echo 'RDEPEND="acct-user/ollama acct-group/ollama"'
                echo ''
                echo "inherit systemd"
                echo ''
                echo "src_unpack() {"
                if [ "${ext}" = "tar.zst" ]; then
                  echo -e '\tif use rocm; then'
                  echo -e '\t\ttar --zstd -xf "${DISTDIR}/${P}.rocm.'${ext}'" \\'
                  echo -e '\t\t\t-C "${WORKDIR}" || die "Failed to unpack rocm"'
                  echo -e '\tfi'
                  echo -e '\tif use amd64; then'
                  echo -e '\t\ttar --zstd -xf "${DISTDIR}/${P}.amd64.'${ext}'" \\'
                  echo -e '\t\t\t-C "${WORKDIR}" || die "Failed to unpack amd64"'
                  echo -e '\telif use arm64; then'
                  echo -e '\t\ttar --zstd -xf "${DISTDIR}/${P}.arm64.'${ext}'" \\'
                  echo -e '\t\t\t-C "${WORKDIR}" || die "Failed to unpack arm64"'
                  echo -e '\tfi'
                else
                  echo -e '\tif use rocm; then'
                  echo -e '\t\tunpack "${P}.rocm.'${ext}'"'
                  echo -e '\tfi'
                  echo -e '\tif use amd64; then'
                  echo -e '\t\tunpack "${P}.amd64.'${ext}'"'
                  echo -e '\telif use arm64; then'
                  echo -e '\t\tunpack "${P}.arm64.'${ext}'"'
                  echo -e '\tfi'
                fi
                echo "}"
                echo ""
                echo "src_install() {"
                echo -e '\texeinto /opt/Ollama/bin'
                echo -e '\tdoexe "${WORKDIR}/bin/ollama" || die "Failed to install binary"'
                echo -e '\tinsinto /opt/Ollama/lib'
                echo -e '\tdoins -r "${WORKDIR}/lib/ollama/"'
                echo -e '\tfperms -R +x /opt/Ollama/lib/ollama'
                echo -e '\tdosym ../Ollama/bin/ollama /opt/bin/ollama'
                echo -e '\t{'
                echo -e '\t\techo "[Unit]"'
                echo -e '\t\techo "Description=Ollama Service"'
                echo -e '\t\techo "After=network-online.target"'
                echo -e '\t\techo ""'
                echo -e '\t\techo "[Service]"'
                echo -e '\t\techo "ExecStart=/opt/Ollama/bin/ollama serve"'
                echo -e '\t\techo "User=ollama"'
                echo -e '\t\techo "Group=ollama"'
                echo -e '\t\techo "Restart=always"'
                echo -e '\t\techo "RestartSec=3"'
                echo -e '\t\techo ""'
                echo -e '\t\techo "[Install]"'
                echo -e '\t\techo "WantedBy=default.target"'
                echo -e '\t} > "${T}/ollama.service"'
                echo -e '\tsystemd_dounit "${T}/ollama.service"'
                echo "}"
                echo ""
                echo "src_prepare() {"
                echo -e '\teapply_user'
                echo "}"
                echo ""
                echo "pkg_postinst() {"
                echo -e '\teinfo "Quick guide:"'
                echo -e '\tif use systemd; then'
                echo -e '\t\teinfo "  To start the system-wide service:"'
                echo -e '\t\teinfo "    systemctl start ollama"'
                echo -e '\t\teinfo "  Or to run it manually as your user:"'
                echo -e '\tfi'
                echo -e '\teinfo "  ollama serve"'
                echo -e '\teinfo ""'
                echo -e '\teinfo "To run a model:"'
                echo -e '\teinfo "  ollama run llama3:70b"'
                echo -e '\teinfo ""'
                echo -e '\teinfo "See available models at https://ollama.com/library"'
                echo "}"
                echo ""
              } > "$tmp_ebuild"

              # Validate and fully build the replacement Manifest before removing
              # the currently published version.
              bash -n "$tmp_ebuild"
              g2 manifest upsert-from-url https://github.com/ollama/ollama/releases/download/${tag}/ollama-linux-amd64.${ext} ${{ env.epn }}-${version}.amd64.${ext} "$tmp_manifest_dir"
              g2 manifest upsert-from-url https://github.com/ollama/ollama/releases/download/${tag}/ollama-linux-arm64.${ext} ${{ env.epn }}-${version}.arm64.${ext} "$tmp_manifest_dir"
              g2 manifest upsert-from-url https://github.com/ollama/ollama/releases/download/${tag}/ollama-linux-amd64-rocm.${ext} ${{ env.epn }}-${version}.rocm.${ext} "$tmp_manifest_dir"
              test -s "$tmp_ebuild"
              test -s "$tmp_manifest_dir/Manifest"

              # Only after all replacement artifacts are ready do we publish the
              # new version and perform one-version-per-grade retention cleanup.
              mv "$tmp_ebuild" "$ebuild_file"
              mv "$tmp_manifest_dir/Manifest" "${ebuild_dir}/Manifest"
              rm -rf "$tmp_manifest_dir"
              find "$ebuild_dir" -maxdepth 1 -type f -name '${{ env.epn }}-*.ebuild' ! -name "$(basename "$ebuild_file")" -delete
              trap - EXIT

              echo "generated_tag=${tag}" >> $GITHUB_OUTPUT
              echo "generated_tag=${tag}" >> $GITHUB_ENV
            fi
          done

      - name: Commit and push changes
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          git add ./${ebuild_dir}
          git commit -m "Add ebuilds for new ${{ env.epn }} releases tag ${{ env.generated_tag }}" &&
          git pull --rebase &&
          git push || true
        if: env.generated_tag
