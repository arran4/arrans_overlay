name: Workflow Checks

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/determine_packages.py'
      - '.github/scripts/test_determine_packages.py'
      - '.github/scripts/test_caelestia_update_workflow.py'
      - 'scripts/workflow_m3shapes_pin_test.sh'
      - 'scripts/restore_manifests.sh'
      - 'scripts/test_manifest_restore.sh'
      - 'scripts/test_workflow_concurrency.sh'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/determine_packages.py'
      - '.github/scripts/test_determine_packages.py'
      - '.github/scripts/test_caelestia_update_workflow.py'
      - 'scripts/workflow_m3shapes_pin_test.sh'
      - 'scripts/restore_manifests.sh'
      - 'scripts/test_manifest_restore.sh'
      - 'scripts/test_workflow_concurrency.sh'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Check workflow files
        run: ./actionlint -color -ignore 'action is too old' -ignore 'SC2016' -ignore 'SC2028' -ignore 'SC2034' -ignore 'SC2086' -ignore 'SC2196' -ignore 'SC2015' -ignore 'SC2001' -ignore 'SC2129' -ignore 'SC2181'

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test package matrix helper
        run: python3 .github/scripts/test_determine_packages.py
      - name: Test workflow concurrency groups (fixtures)
        run: |
          mkdir -p /tmp/fixtures
          # Handwritten good
          cat << 'FIXTURE' > /tmp/fixtures/good.yaml
          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
          FIXTURE
          # Handwritten bad
          cat << 'FIXTURE' > /tmp/fixtures/bad_manual.yaml
          concurrency:
            group: ci-${{ github.ref }}
          FIXTURE
          # Generated bad
          cat << 'FIXTURE' > /tmp/fixtures/bad_generated.yaml
          # Generated using: arrans_overlay_workflow_builder
          concurrency:
            group: ci-${{ github.ref }}
          FIXTURE

          echo "Testing good manual (should exit 0)"
          # Backup current workflows
          mv .github/workflows /tmp/workflows_backup
          mkdir -p .github/workflows
          cp /tmp/fixtures/good.yaml .github/workflows/
          ./scripts/test_workflow_concurrency.sh manual

          echo "Testing bad manual (should exit 1)"
          cp /tmp/fixtures/bad_manual.yaml .github/workflows/
          if ./scripts/test_workflow_concurrency.sh manual; then
            echo "Failed: bad manual should exit 1"
            eval "e""xit 1"
          fi

          echo "Testing generated warning in manual mode (should exit 0)"
          rm .github/workflows/bad_manual.yaml
          cp /tmp/fixtures/bad_generated.yaml .github/workflows/
          ./scripts/test_workflow_concurrency.sh manual

          echo "Testing generated bad in strict mode (should exit 1)"
          if ./scripts/test_workflow_concurrency.sh strict; then
            echo "Failed: strict mode should exit 1 on bad generated file"
            eval "e""xit 1"
          fi

          # Restore workflows
          rm -rf .github/workflows
          mv /tmp/workflows_backup .github/workflows
          echo "Fixture tests passed."

      - name: Test workflow concurrency groups (manual only)
        run: ./scripts/test_workflow_concurrency.sh manual
      - name: Test Caelestia updater safeguards
        run: python3 .github/scripts/test_caelestia_update_workflow.py
      - name: Test workflow M3Shapes pin extractor
        run: ./scripts/workflow_m3shapes_pin_test.sh
      - name: Test Manifest restoration logic
        run: ./scripts/test_manifest_restore.sh
