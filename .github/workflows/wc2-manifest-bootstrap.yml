name: WC2 source archive hash bootstrap (temporary)

on:
  push:
    branches: [games-action-wc2-re-source-0.9.2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash upstream v0.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          file=wc2-re-0.9.2.tar.gz
          curl --fail --location --retry 3 \
            --output "$file" \
            https://github.com/neuromancer/wc2-re/archive/refs/tags/v0.9.2.tar.gz
          tar -tzf "$file" | grep -Fx 'wc2-re-0.9.2/third_party/ymfm/LICENSE'
          echo "DIST $file $(stat -c '%s' "$file") BLAKE2B $(b2sum "$file" | cut -d ' ' -f1) SHA512 $(sha512sum "$file" | cut -d ' ' -f1)"
