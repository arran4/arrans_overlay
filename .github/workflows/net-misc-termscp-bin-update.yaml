# Generated using: https://github.com/arran4/arrans_overlay_workflow_builder 0.1.23 Github Binary Release current.config 2026-03-03 10:16:15.640186701 +0000 UTC m=+0.016826779

name: net-misc/termscp-bin update

permissions:
  contents: write

on:
  schedule:
    - cron: '46 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/net-misc-termscp-bin-update.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ecn: net-misc
  epn: termscp-bin
  description: "Feature rich terminal file transfer tool"
  homepage: "https://termscp.veeso.dev"
  github_owner: veeso
  github_repo: termscp
  keywords: ~amd64 ~arm64
  workflow_filename: net-misc-termscp-bin-update.yaml
  termscp_binary_installed_name: 'termscp'
  termscp_binary_archived_name_amd64: 'termscp'
  termscp_release_name_amd64: 'termscp-${tag}-x86_64-unknown-linux-musl.tar.gz'
  termscp_binary_archived_name_arm64: 'termscp'
  termscp_release_name_arm64: 'termscp-${tag}-aarch64-unknown-linux-musl.tar.gz'

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install required tools
        run: |
            sudo apt-get update
            sudo apt-get install -y wget jq coreutils
      - name: Process each release
        id: process_releases
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          mkdir -p "$ebuild_dir"
          metadata_file="${ebuild_dir}/metadata.xml"
          if [ ! -f "$metadata_file" ]; then
            cat <<-"EOF" > "$metadata_file"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE pkgmetadata SYSTEM "http://www.gentoo.org/dtd/metadata.dtd">
          <pkgmetadata>
            <upstream>
              <remote-id type="github">veeso/termscp</remote-id>
            </upstream>
          </pkgmetadata>
          EOF
          fi
          declare -A releaseTypes=()
          tags=$(curl -s  --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${{secrets.GITHUB_TOKEN}}" https://api.github.com/repos/${{ env.github_owner }}/${{ env.github_repo }}/releases | jq -r '.[]? | select(type=="object" and has("tag_name")) | .tag_name')
          # shellcheck disable=SC2086
          for tag in $tags; do
            version="${tag#v}"
            if [ "${version}" = "${tag}" ]; then
                echo "$version == $tag so there is no v removed skipping"
                continue
            fi
            # shellcheck disable=SC2034
            originalVersion="${version}"
            if ! echo "${version}" | grep -E '^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-r[0-9]+)?((_)(alpha|beta|rc|p)[0-9]*)*$'; then
                echo "tag / $version doesn't match regexp";
                continue;
            fi
            releaseType="$(echo "${version}" | sed -n 's/^[^_]\+_\(alpha\|beta\|rc\|p[0-9]*\).*$/\1/p')"
            if [[ ! -v releaseTypes[${releaseType:=release}] ]]; then
                if [[ -v releaseTypes[release] ]]; then
                  echo "Already have a newer main release: ${releaseTypes[release]}"
                  continue
                fi
                releaseTypes[${releaseType:=release}]="${version}"
            else
                echo "Already have a newer ${releaseType:=release} release: ${releaseTypes[${releaseType:=release}]}"
                continue
            fi
            ebuild_file="${ebuild_dir}/${{ env.epn }}-${version}.ebuild"
            if [ ! -f "$ebuild_file" ]; then

              # shellcheck disable=SC2016
              {
                echo '# Copyright 2026 Gentoo Authors'
                echo '# Distributed under the terms of the GNU General Public License v2'
                echo ''
                echo '# Generated via: https://github.com/arran4/arrans_overlay/blob/main/'
                echo '#   .github/workflows/${{ env.workflow_filename }}'
                echo 'EAPI=8'
                echo "DESCRIPTION=\"${{ env.description }}\""
                echo "HOMEPAGE=\"${{ env.homepage }}\""
                echo ''
                echo "URI=\"github.com/${{ env.github_owner }}/${{ env.github_repo }}/releases/download/v\${PV}\""
                echo 'SRC_URI="'
                printf '\t%s\n' 'amd64? ('
                printf '\t\t%s\n' "https://\${URI}/termscp-v\${PV}-x86_64-unknown-linux-musl.tar.gz"
                printf '\t\t\t%s\n' "-> \${P}-termscp-v\${PV}-x86_64-unknown-linux-musl.tar.gz"
                printf '\t%s\n' ')'
                printf '\t%s\n' 'arm64? ('
                printf '\t\t%s\n' "https://\${URI}/termscp-v\${PV}-aarch64-unknown-linux-musl.tar.gz"
                printf '\t\t\t%s\n' "-> \${P}-termscp-v\${PV}-aarch64-unknown-linux-musl.tar.gz"
                printf '\t%s\n' ')'
                echo '"'
                echo 'LICENSE="MIT"'
                echo 'SLOT="0"'
                echo 'KEYWORDS="${{ env.keywords }}"'
                echo 'IUSE=""'
                echo ''
                echo 'REQUIRED_USE=""'
                echo ''
                echo 'RDEPEND="net-fs/samba "'
                echo ''
                echo 'S="${WORKDIR}"'
                echo ''
                echo 'src_unpack() {'
                printf '\t%s\n' 'if use amd64; then'
                printf '\t\t%s\n' "unpack \\"
                printf '\t\t\t%s\n' "\"\${DISTDIR}/\${P}-termscp-v\${PV}-x86_64-unknown-linux-musl.tar.gz\" \\"
                printf '\t\t\t%s\n' "|| die \"Can't unpack archive file\""
                printf '\t%s\n' 'fi'
                printf '\t%s\n' 'if use arm64; then'
                printf '\t\t%s\n' "unpack \\"
                printf '\t\t\t%s\n' "\"\${DISTDIR}/\${P}-termscp-v\${PV}-aarch64-unknown-linux-musl.tar.gz\" \\"
                printf '\t\t\t%s\n' "|| die \"Can't unpack archive file\""
                printf '\t%s\n' 'fi'
                echo '}'
                echo ''
                echo 'src_install() {'
                printf '\t%s\n' 'exeinto /opt/bin'
                printf '\t%s\n' 'if use amd64; then'
                printf '\t\t%s\n' 'newexe "${{ env.termscp_binary_archived_name_amd64 }}" "${{ env.termscp_binary_installed_name }}" || die "Failed to install Binary"'
                printf '\t%s\n' 'fi'
                printf '\t%s\n' 'if use arm64; then'
                printf '\t\t%s\n' 'newexe "${{ env.termscp_binary_archived_name_arm64 }}" "${{ env.termscp_binary_installed_name }}" || die "Failed to install Binary"'
                printf '\t%s\n' 'fi'
                echo '}'
              } > "$ebuild_file"

              # Manifest generation

              g2 manifest upsert-from-url "https://github.com/${{ env.github_owner }}/${{ env.github_repo }}/releases/download/${tag}/termscp-${tag}-x86_64-unknown-linux-musl.tar.gz" "${{ env.epn }}-${version}-termscp-${tag}-x86_64-unknown-linux-musl.tar.gz" "${ebuild_dir}/Manifest"
              g2 manifest upsert-from-url "https://github.com/${{ env.github_owner }}/${{ env.github_repo }}/releases/download/${tag}/termscp-${tag}-aarch64-unknown-linux-musl.tar.gz" "${{ env.epn }}-${version}-termscp-${tag}-aarch64-unknown-linux-musl.tar.gz" "${ebuild_dir}/Manifest"
              echo "generated_tag=${tag}" >> $GITHUB_OUTPUT
            fi
          done

      - name: Deduplicate ebuilds
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          g2 ebuild deduplicate "${ebuild_dir}"

      - name: Commit and push changes
        run: |
          ebuild_dir="./${{ env.ecn }}/${{ env.epn }}"
          git add "./${ebuild_dir}"
          if git commit -m "Add ebuilds for new ${{ env.epn }} releases tag ${generated_tag}"; then
            git pull --rebase &&
            git push
          fi || true
        if: steps.process_releases.outputs.generated_tag
