name: dev-lang/flutter (Source) Update

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-flutter-source-update-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Flutter version'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/dev-lang-flutter-source-update.yaml'
      - 'scripts/update_flutter_source.py'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run Flutter Source Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            python3 scripts/update_flutter_source.py --version "${{ github.event.inputs.version }}"
          else
            python3 scripts/update_flutter_source.py
          fi
