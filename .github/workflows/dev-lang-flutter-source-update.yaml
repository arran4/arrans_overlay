name: dev-lang/flutter (Source) Update

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ci-flutter-source-update-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Flutter version'
        required: false
        type: string
      ref:
        description: 'Explicit stable upstream ref/hash (optional)'
        required: false
        type: string
      refresh:
        description: 'Refresh the existing automated PR for this exact version'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dev-lang-flutter-source-update.yaml'
      - 'scripts/update_flutter_source.py'
      - 'scripts/flutter_release_spec.py'
      - 'scripts/generate_flutter_ebuild.py'
      - 'scripts/generate_flutter_engine_ebuild.py'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run Flutter Source Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_REF: ${{ inputs.ref }}
          REQUEST_REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          if [ -n "$REQUESTED_REF" ]; then
            args+=(--ref "$REQUESTED_REF")
          fi
          if [ "$REQUEST_REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          # GitHub does not recursively trigger pull_request workflows for a
          # PR created with GITHUB_TOKEN. The updater therefore dispatches
          # read-only validation workflows on the newly-created PR branch.
          python3 scripts/update_flutter_source.py "${args[@]}"
