name: Repair Cache

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      g2_version:
        description: 'Version of g2 to use'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install g2
        uses: arran4/g2-action@v1.2
        with:
          version: ${{ inputs.g2_version || 'latest' }}

      - name: Reconcile cache
        run: g2 cache reconcile --repo .

      - name: Verify cache consistency
        run: g2 cache verify --repo .

      - name: Stage cache changes
        id: stage_cache
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"

          # Ensure reconcile did not mutate files outside the intended cache scope
          if ! git diff --quiet -- ':!metadata/md5-cache' ':!metadata/md5-dict'; then
            echo "Error: cache reconciliation modified files outside cache scope:" >&2
            git status --short -- ':!metadata/md5-cache' ':!metadata/md5-dict' >&2
            exit 1
          fi

          # Stage canonical metadata/md5-cache if it exists on disk or was tracked
          if [ -d "metadata/md5-cache" ] || git ls-files --error-unmatch metadata/md5-cache >/dev/null 2>&1; then
            git add -A -- metadata/md5-cache
          fi

          # Stage legacy metadata/md5-dict if it exists on disk or was tracked (to capture deletion)
          if [ -d "metadata/md5-dict" ] || git ls-files --error-unmatch metadata/md5-dict >/dev/null 2>&1; then
            git add -A -- metadata/md5-dict
          fi

          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Cache is already fully reconciled; no changes staged."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Staged cache changes:"
            git diff --staged --name-status
          fi

      - name: Build PR body
        if: steps.stage_cache.outputs.has_changes == 'true'
        shell: bash
        run: |
          cat <<'BODY' > /tmp/pr-body.md
          Reconciles Portage metadata cache using `g2 cache reconcile --repo .` and verified via `g2 cache verify --repo .`.

          ### Changes
          - Generates missing cache entries under canonical `metadata/md5-cache/`
          - Removes stale/orphan cache entries
          - Removes legacy `metadata/md5-dict/` state
          - Verifies cache consistency and `_md5_` digests

          This pull request was automatically generated by the [Repair Cache] workflow.
          BODY

      - name: Create Pull Request
        if: steps.stage_cache.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: repair metadata cache"
          title: "fix: repair metadata cache"
          body-path: /tmp/pr-body.md
          branch: "fix/cache-repair"
          delete-branch: true
          base: main
          assignees: arran4
