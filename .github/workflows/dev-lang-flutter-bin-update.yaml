name: dev-lang/flutter-bin Update

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ebuild_category: "dev-lang"
  ebuild_name: "flutter-bin"

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dev-lang-flutter-bin-update.yaml'

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq coreutils

      - name: Process latest stable release
        id: process_releases
        run: |
          ebuild_dir="./${ebuild_category}/${ebuild_name}"
          mkdir -p "${ebuild_dir}"

          template_file=$(find "${ebuild_dir}" -maxdepth 1 -type f -name "${ebuild_name}-*.ebuild" -print | sort -V | tail -n 1)
          if [ -z "${template_file}" ]; then
            echo "No existing ${ebuild_name} ebuild is available to use as a packaging template" >&2
            exit 1
          fi

          versions=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json |
            jq -r '.releases[] | select(.channel == "stable") | .version')

          for version in ${versions}; do
            if ! echo "${version}" | grep -Eq '^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-r[0-9]+)?((_)(alpha|beta|rc|p)[0-9]*)*$'; then
              echo "${version} doesn't match regexp"
              continue
            fi

            # A downstream Gentoo revision still represents this same upstream
            # Flutter version. Do not recreate an unrevisioned ebuild beside it.
            existing_ebuild=$(find "${ebuild_dir}" -maxdepth 1 -type f \
              \( -name "${ebuild_name}-${version}.ebuild" \
                 -o -name "${ebuild_name}-${version}-r[0-9]*.ebuild" \) \
              -print -quit)

            if [ -z "${existing_ebuild}" ]; then
              ebuild_file="${ebuild_dir}/${ebuild_name}-${version}.ebuild"

              # The ebuild deliberately contains no version-specific packaging
              # logic: ${PV} selects the upstream archive and the installed
              # wrapper substitutes the package version at build time. Copying
              # the last known-good ebuild ensures downstream patches and the
              # immutable-/opt launcher are not lost when a release appears.
              cp "${template_file}" "${ebuild_file}"

              g2 manifest upsert-from-url \
                "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${version}-stable.tar.xz" \
                "${ebuild_name}-${version}.amd64.tar.xz" \
                "${ebuild_dir}/Manifest"
            fi
            break
          done

      - name: Commit and push changes
        if: steps.process_releases.conclusion == 'success'
        run: |
          ebuild_dir="./${ebuild_category}/${ebuild_name}"
          git add "${ebuild_dir}"
          git commit -m "Add ebuilds for new ${ebuild_name} releases" &&
          git pull --rebase &&
          git push || true
