name: www-misc/which_browser update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/www-misc-which_browser-update.yaml'
      - 'scripts/update_which_browser.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Process releases
        id: process_releases
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_which_browser.py

      - name: Create Pull Request
        id: create_pr
        if: steps.process_releases.outputs.generated_version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            www-misc/which_browser/*.ebuild
            www-misc/which_browser/Manifest
          commit-message: "www-misc/which_browser: bump to ${{ steps.process_releases.outputs.generated_version }}"
          title: "Update which_browser to ${{ steps.process_releases.outputs.generated_tag }}"
          body: |
            Automated update for `www-misc/which_browser` to release `${{ steps.process_releases.outputs.generated_tag }}` (Gentoo PV `${{ steps.process_releases.outputs.generated_version }}`).

            Authoritative release metadata discovered via GitHub Releases API (`arran4/which_browser`).
            Anonymous download payload and checksum verified against `${{ steps.process_releases.outputs.target_url }}`.
          branch: "update-which_browser-${{ steps.process_releases.outputs.generated_tag }}"
          base: main
          labels: "automated pr"

      - name: Verify Generated PR
        if: steps.process_releases.outputs.generated_version != ''
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.create_pr.outputs.pull-request-operation }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || "$PR_URL" != "https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" ]]; then
            echo "::error::An update was generated, but create-pull-request did not return a valid PR number and URL."
            exit 1
          fi
          echo "Confirmed $PR_OPERATION PR #$PR_NUMBER: $PR_URL"
