name: www-misc/which_browser update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/www-misc-which_browser-update.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ebuild_category: www-misc
  ebuild_name: which_browser

jobs:
  check-and-create-ebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq coreutils python3

      - name: Process releases
        id: process_releases
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python3 scripts/update_which_browser.py

      - name: Create Pull Request
        if: steps.process_releases.outputs.generated_version
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add ebuilds for new which_browser releases tag ${{ steps.process_releases.outputs.generated_tag }}"
          title: "Update which_browser to ${{ steps.process_releases.outputs.generated_tag }}"
          body: "This PR updates which_browser to the latest release ${{ steps.process_releases.outputs.generated_tag }}."
          branch: "update-which_browser-${{ steps.process_releases.outputs.generated_tag }}"
          base: main
