name: Refresh Workflows

on:
  schedule:
    # 05:00 AEST / 06:00 AEDT on the 2nd day of each month
    - cron: '0 19 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - current.config
      - .github/workflows/refresh-workflows.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate workflows
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/arran4/arrans_overlay_workflow_builder/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" == "null" ]; then
            echo "Failed to get latest version"
            exit 1
          fi
          VERSION_NUM=${LATEST_VERSION#v}
          wget "https://github.com/arran4/arrans_overlay_workflow_builder/releases/download/${LATEST_VERSION}/arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz"
          tar -xzf "arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz" overlay_workflow_builder_generator
          chmod +x overlay_workflow_builder_generator
          ./overlay_workflow_builder_generator generate workflows -input-file current.config -output-dir .github/workflows
          rm overlay_workflow_builder_generator
          rm "arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz"

      - name: Discard non-substantive changes
        run: |
          # Use --ignore-blank-lines, not a second -I regex matching the empty
          # string: the latter suppresses real code changes as well as blanks.
          git add .github/workflows/
          for file in $(git diff --cached --name-only); do
            # Check if file existed before
            if git ls-tree -r HEAD --name-only | grep -q "^${file}$"; then
              if [ -z "$(git diff --cached -w --ignore-blank-lines -I '^[[:space:]]*#' -- "$file")" ]; then
                echo "Reverting $file because only comments/whitespace changed"
                git reset HEAD "$file"
                git checkout -- "$file"
              fi
            fi
          done

      - name: Check for remaining changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # Reuse the repository's existing GitHub App identity, or PAT_TOKEN.
      # The App installation must have Workflows: write to update
      # .github/workflows/*.yml; GITHUB_TOKEN cannot be granted this permission.
      - name: Select existing publication credentials
        if: steps.check_changes.outputs.has_changes == 'true'
        id: auth
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "auth_type=app" >> "$GITHUB_OUTPUT"
            echo "Using existing GitHub App."
          elif [[ -n "$PAT_TOKEN" ]]; then
            echo "auth_type=pat" >> "$GITHUB_OUTPUT"
            echo "Using existing PAT_TOKEN."
          else
            echo "::error::Workflow publication needs existing APP_ID/APP_PRIVATE_KEY (with Workflows write permission), or PAT_TOKEN with workflow-file write access."
            exit 1
          fi

      - name: Generate existing App installation token
        if: steps.auth.outputs.auth_type == 'app'
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.auth.outputs.auth_type == 'app' && steps.app_token.outputs.token || secrets.PAT_TOKEN }}
          branch: automation/refresh-generated-workflows
          base: main
          delete-branch: true
          commit-message: "chore: refresh workflows from config"
          title: "Automated Workflow Refresh"
          assignees: arran4
          body: |
            This PR was auto-generated by the workflow refresh task.
            Generated from the latest released arrans_overlay_workflow_builder with current.config.

      - name: Confirm publication
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.create_pr.outputs.pull-request-operation }}
        shell: bash
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || "$PR_URL" != "https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" ]]; then
            echo "::error::Generated changes but no valid pull request was returned."
            exit 1
          fi
          case "$PR_OPERATION" in
            created|updated) echo "Generated workflows PR $PR_NUMBER: $PR_URL" ;;
            *) echo "::error::Unexpected PR operation: $PR_OPERATION"; exit 1 ;;
          esac
