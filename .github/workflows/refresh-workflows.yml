name: Refresh Workflows

on:
  schedule:
    # 05:00 AEST / 06:00 AEDT on the 2nd day of each month
    - cron: '0 19 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - current.config
      - .github/workflows/refresh-workflows.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate workflows
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/arran4/arrans_overlay_workflow_builder/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" == "null" ]; then
            echo "Failed to get latest version"
            exit 1
          fi
          VERSION_NUM=${LATEST_VERSION#v}
          wget "https://github.com/arran4/arrans_overlay_workflow_builder/releases/download/${LATEST_VERSION}/arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz"
          tar -xzf "arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz" overlay_workflow_builder_generator
          chmod +x overlay_workflow_builder_generator
          ./overlay_workflow_builder_generator generate workflows -input-file current.config -output-dir .github/workflows
          rm overlay_workflow_builder_generator
          rm "arrans_overlay_workflow_builder_${VERSION_NUM}_linux_amd64.tar.gz"

      - name: Discard non-substantive changes
        run: |
          # Use --ignore-blank-lines, not a second -I regex matching the empty
          # string: the latter suppresses real code changes as well as blanks.
          git add .github/workflows/
          for file in $(git diff --cached --name-only); do
            # Check if file existed before
            if git ls-tree -r HEAD --name-only | grep -q "^${file}$"; then
              if [ -z "$(git diff --cached -w --ignore-blank-lines -I '^[[:space:]]*#' -- "$file")" ]; then
                echo "Reverting $file because only comments/whitespace changed"
                git reset HEAD "$file"
                git checkout -- "$file"
              fi
            fi
          done

      - name: Check for remaining changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh workflows from config"
          title: "Automated Workflow Refresh"
          assignees: arran4
          body: |
            This PR was auto-generated by the workflow refresh task.
