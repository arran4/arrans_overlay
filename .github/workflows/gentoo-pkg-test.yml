name: Gentoo Package Test

on:
  schedule:
    - cron: '0 0 1 * *' # Once a month
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.ebuild'
      - '.github/workflows/gentoo-pkg-test.yml'
      - '.github/scripts/determine_packages.py'
  pull_request:
    paths:
      - '**/*.ebuild'
      - '.github/workflows/gentoo-pkg-test.yml'
      - '.github/scripts/determine_packages.py'

concurrency:
  group: gentoo-pkg-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --diff-filter=ACMR --name-only "origin/${{ github.base_ref }}...HEAD")
            SOURCE_FILES="$CHANGED_FILES"
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --diff-filter=ACMR --name-only \
              "${{ github.event.before }}" "${{ github.sha }}")
            SOURCE_FILES="$CHANGED_FILES"
          else
            CHANGED_FILES=$(find . -name '*.ebuild')
            SOURCE_FILES=""
          fi

          export CHANGED_FILES
          export SOURCE_FILES
          MATRIX_JSON=$(python3 .github/scripts/determine_packages.py)
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $MATRIX_JSON"

  test-packages:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Gentoo build environment
        id: gentoo-environment
        run: |
          docker pull gentoo/stage3:latest
          docker pull gentoo/portage:latest
          STAGE3_ID=$(docker image inspect --format='{{.Id}}' gentoo/stage3:latest)
          PORTAGE_ID=$(docker image inspect --format='{{.Id}}' gentoo/portage:latest)
          ENVIRONMENT_ID=$(printf '%s\n%s\n' "$STAGE3_ID" "$PORTAGE_ID" | sha256sum | cut -c1-16)
          echo "cache_id=$ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        run: |
          sudo mkdir -p /var/cache/distfiles /var/cache/binpkgs
          sudo chown -R "$(id -u):$(id -g)" /var/cache/distfiles /var/cache/binpkgs

      - name: Cache distfiles
        uses: actions/cache@v4
        with:
          path: /var/cache/distfiles
          key: gentoo-distfiles-v1-${{ github.sha }}-${{ matrix.cache_id }}
          restore-keys: |
            gentoo-distfiles-v1-

      - name: Restore binpkgs
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/binpkgs
          # Actions caches are immutable and restore one archive, not a union.
          # Give each package job a distinct lineage so parallel jobs can all
          # save their results. Prefer that lineage on later runs, then fall
          # back to one cache from the same compatible Gentoo environment.
          # This lookup-only primary key is never saved. It prevents the cache
          # action's implicit primary-key prefix match from bypassing the
          # explicitly ordered group/package restore lineages below.
          key: gentoo-binpkgs-restore-v6-${{ steps.gentoo-environment.outputs.cache_id }}-${{ github.run_id }}-${{ matrix.cache_id }}
          restore-keys: |
            gentoo-binpkgs-v6-${{ steps.gentoo-environment.outputs.cache_id }}-${{ matrix.cache_lineage }}-
            gentoo-binpkgs-v5-${{ steps.gentoo-environment.outputs.cache_id }}-${{ matrix.cache_lineage }}-
            gentoo-binpkgs-v4-${{ steps.gentoo-environment.outputs.cache_id }}-${{ matrix.cache_id }}-
            gentoo-binpkgs-v5-${{ steps.gentoo-environment.outputs.cache_id }}-${{ matrix.group }}-
            gentoo-binpkgs-v5-${{ steps.gentoo-environment.outputs.cache_id }}-
            gentoo-binpkgs-v4-${{ steps.gentoo-environment.outputs.cache_id }}-

      - name: Start Gentoo stage3
        run: |
          docker create --name portage gentoo/portage:latest
          docker run --detach \
            --name gentoo \
            --volumes-from portage \
            --volume "${GITHUB_WORKSPACE}:/var/db/repos/arrans-overlay:ro" \
            --volume "/var/cache/distfiles:/var/cache/distfiles:rw" \
            --volume "/var/cache/binpkgs:/var/cache/binpkgs:rw" \
            gentoo/stage3:latest \
            sleep infinity

      - name: Install and test packages
        timeout-minutes: 105
        run: |
          PACKAGE="${{ matrix.package }}"
          SOURCE_TARGET="${{ matrix.source_target }}"

          # Create a script to run inside the docker container
          cat << 'INNEREOF' > test_packages.sh
          #!/bin/bash
          set -euxo pipefail

          mkdir -p /etc/portage/repos.conf
          printf "%s\n" \
            "[gentoo]" \
            "location = /var/db/repos/gentoo" \
            "auto-sync = no" \
            > /etc/portage/repos.conf/gentoo.conf

          printf "%s\n" \
            "[guru]" \
            "location = /var/db/repos/guru" \
            "sync-type = git" \
            "sync-uri = https://github.com/gentoo-mirror/guru.git" \
            "auto-sync = yes" \
            > /etc/portage/repos.conf/guru.conf

          printf "%s\n" \
            "[hyproverlay]" \
            "location = /var/db/repos/hyproverlay" \
            "sync-type = git" \
            "sync-uri = https://codeberg.org/hyproverlay/hyproverlay.git" \
            "auto-sync = yes" \
            > /etc/portage/repos.conf/hyproverlay.conf

          printf "%s\n" \
            "[arrans-overlay]" \
            "location = /var/db/repos/arrans-overlay" \
            "masters = gentoo guru hyproverlay" \
            "auto-sync = no" \
            > /etc/portage/repos.conf/arrans-overlay.conf

          # Accept all licenses. Keyword only the packages under test below;
          # globally enabling ~amd64 can make the stable stage3 inconsistent
          # with newer unstable toolchain packages in the Portage snapshot.
          echo 'ACCEPT_LICENSE="*"' >> /etc/portage/make.conf
          echo 'FEATURES="${FEATURES} buildpkg"' >> /etc/portage/make.conf
          # Prefer Gentoo's public binhost and the shared CI binpkg cache for
          # speed, while retaining normal source builds when no compatible
          # package exists. Overlay packages usually are not on the public
          # binhost, but generic dependencies need not be rebuilt. Keep normal
          # binary USE compatibility so binaries cannot introduce an
          # inconsistent multilib or init-system dependency lineage.
          echo 'EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --usepkg --getbinpkg"' \
            >> /etc/portage/make.conf
          # This disposable CI container lets Portage persist only its
          # package-scoped autounmask configuration directly. Otherwise
          # CONFIG_PROTECT creates ._cfg files, which a later emerge can not
          # see without a separate etc-update and dependency calculation.
          echo 'CONFIG_PROTECT_MASK="${CONFIG_PROTECT_MASK} /etc/portage/package.accept_keywords /etc/portage/package.use /etc/portage/package.unmask"' \
            >> /etc/portage/make.conf

          # Qt's public binhost contains multiple builds with opposing qtbase
          # OpenGL requirements. Overlay targets require qtbase[opengl], so
          # constrain only qtbase and let Portage select matching Qt binaries.
          mkdir -p /etc/portage/package.use
          printf "%s\n" \
            "dev-qt/qtbase opengl" \
            "dev-qt/qtdeclarative opengl" \
            "media-libs/freetype harfbuzz" \
            "media-libs/libglvnd X" \
            "x11-libs/cairo X" \
            "media-sound/pulseaudio-daemon -webrtc-aec" \
            > /etc/portage/package.use/zz-ci-required-use

          emerge -v dev-vcs/git
          emerge --sync guru
          emerge --sync hyproverlay

          # Install pkgcheck
          emerge -v dev-util/pkgcheck

          PKG="$1"
          SOURCE_TARGET="$2"

          mkdir -p /etc/portage/package.accept_keywords
          printf "%s ~amd64\n" "$PKG" > /etc/portage/package.accept_keywords/ci

          FAILED_PACKAGES=""
          echo "Running pkgcheck on $PKG"
          CP=$(python3 -c "import portage; print(portage.dep.Atom(\"$PKG\").cp)")
          if ! pkgcheck scan --net --exit error /var/db/repos/arrans-overlay/${CP}; then
            echo "pkgcheck failed for $PKG"
            FAILED_PACKAGES="$FAILED_PACKAGES $PKG (pkgcheck)"
          fi

          echo "Building and testing $PKG"
          TARGET_BINARY_OPTIONS=()
          if [ "$SOURCE_TARGET" = "true" ]; then
            # A cached binary for this exact CPV may predate the checked-out
            # ebuild. Dependencies remain binary-first, but a directly changed
            # target must be built from the source under test.
            TARGET_BINARY_OPTIONS+=(--usepkg-exclude "$PKG")
          fi
          # Resolve and install in one operation so autounmask-continue can
          # apply all proposed changes to this graph without an expensive
          # second calculation. Prefer compatible binaries for dependencies
          # and the target, with normal source fallback for unavailable or
          # incompatible binpkgs. Extra backtracking helps Portage reject a
          # stale binary whose recorded dependency subslots conflict with
          # the installed graph and select a compatible source build.
          # The stage3 is disposable: resolve the requested target rather than
          # preserving unrelated packages inherited through its @world set, so
          # Portage may complete soft-blocked installed-package transitions.
          if ! emerge -v \
            --usepkg --getbinpkg --binpkg-changed-deps=y --ignore-world=y \
            --useoldpkg-atoms='*/*' \
            --autounmask=y --autounmask-write=y --autounmask-continue=y \
            --backtrack=50 \
            "${TARGET_BINARY_OPTIONS[@]}" \
            "$PKG"; then
            echo "Failed to emerge $PKG"
            FAILED_PACKAGES="$FAILED_PACKAGES $PKG (emerge)"
          fi

          if [ -n "$FAILED_PACKAGES" ]; then
            echo "The following packages failed to build, install, or pass pkgcheck: $FAILED_PACKAGES"
            exit 1
          fi
          INNEREOF
          sed -i 's/exit/exit/g' test_packages.sh

          chmod +x test_packages.sh
          docker cp test_packages.sh gentoo:/tmp/test_packages.sh
          docker exec gentoo /tmp/test_packages.sh \
            "$PACKAGE" "$SOURCE_TARGET"

      - name: Stop active Gentoo build
        if: always()
        run: docker stop gentoo || true

      - name: Save built binpkgs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/binpkgs
          key: gentoo-binpkgs-v6-${{ steps.gentoo-environment.outputs.cache_id }}-${{ matrix.group }}-${{ matrix.cache_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop and clean up containers
        if: always()
        run: |
          docker stop gentoo || true
          docker stop portage || true
          docker rm --force gentoo || true
          docker rm --force portage || true
