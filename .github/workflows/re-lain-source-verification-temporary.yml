name: re-Lain source verification (temporary)

on:
  push:
    branches:
      - pkg/re-lain-native-0.2.0

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release source archive and calculate Gentoo Manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/VandalsEmpire/lain-psx-decompiled-android/archive/refs/tags/android-v0.2.0.tar.gz" \
            --output re-lain-0.2.0.tar.gz
          echo "----- Gentoo Manifest DIST entry -----"
          printf 'DIST re-lain-0.2.0.tar.gz %s BLAKE2B %s SHA512 %s\n' \
            "$(stat --format=%s re-lain-0.2.0.tar.gz)" \
            "$(b2sum re-lain-0.2.0.tar.gz | cut -d' ' -f1)" \
            "$(sha512sum re-lain-0.2.0.tar.gz | cut -d' ' -f1)"
          mkdir source
          tar xzf re-lain-0.2.0.tar.gz -C source --strip-components=1
          test -f source/port/CMakeLists.txt
          test -f source/docs/assets/save-icon.svg

      - name: Install system dependencies for the Linux port
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev libgl-dev cmake ninja-build

      - name: Smoke-test source build using system dependencies
        run: |
          cmake -S source/port -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAIN_STATIC_DEPS=OFF
          cmake --build build --parallel 2
          test -x build/lain
