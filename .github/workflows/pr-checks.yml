name: PR Checks

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # Job to run static analysis (fast)
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for commits check
      - name: Configure git remote
        run: git remote set-head origin -a

      - name: Clone external repositories
        run: |
          mkdir -p repos
          git clone --depth=1 https://github.com/gentoo-mirror/gentoo.git repos/gentoo
          git clone --depth=1 https://github.com/gentoo-mirror/guru.git repos/guru
          git clone --depth=1 https://codeberg.org/hyproverlay/hyproverlay.git repos/hyproverlay

      - name: Run pkgcheck
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/var/db/repos/arrans-overlay" \
            -v "${GITHUB_WORKSPACE}/repos/gentoo:/var/db/repos/gentoo" \
            -v "${GITHUB_WORKSPACE}/repos/guru:/var/db/repos/guru" \
            -v "${GITHUB_WORKSPACE}/repos/hyproverlay:/var/db/repos/hyproverlay" \
            ghcr.io/pkgcore/pkgcheck:latest \
            bash -euxo pipefail -c '
              mkdir -p /etc/portage/repos.conf
              ln -snf /var/db/repos/gentoo/profiles/default/linux/amd64/23.0 /etc/portage/make.profile

              printf "%s\n" \
                "[gentoo]" \
                "location = /var/db/repos/gentoo" \
                "auto-sync = no" \
                > /etc/portage/repos.conf/gentoo.conf

              printf "%s\n" \
                "[guru]" \
                "location = /var/db/repos/guru" \
                "auto-sync = no" \
                > /etc/portage/repos.conf/guru.conf

              printf "%s\n" \
                "[hyproverlay]" \
                "location = /var/db/repos/hyproverlay" \
                "auto-sync = no" \
                > /etc/portage/repos.conf/hyproverlay.conf

              printf "%s\n" \
                "[arrans-overlay]" \
                "location = /var/db/repos/arrans-overlay" \
                "masters = gentoo guru hyproverlay" \
                "auto-sync = no" \
                > /etc/portage/repos.conf/arrans-overlay.conf

              cd /var/db/repos/arrans-overlay
              git config --global --add safe.directory /var/db/repos/arrans-overlay
              pkgcheck scan --exit GentooCI --keywords=-UnknownManifest --commits
            '

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  g2-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arran4/g2-action@v1.2
      - name: Run g2 lint on changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" == "0000000000000000000000000000000000000000" ]; then
               BASE="HEAD~1"
            fi
          fi

          echo "Comparing $BASE to $HEAD"
          CHANGED_FILES=$(git diff --name-only $BASE $HEAD || true)

          # Extract unique package directories (e.g., category/package)
          DIRS=$(echo "$CHANGED_FILES" | grep -E "^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+/" | cut -d/ -f1,2 | sort -u | tr '\n' ' ' || true)
          EXISTING_DIRS=""
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              EXISTING_DIRS="$EXISTING_DIRS $dir"
            fi
          done
          DIRS="$EXISTING_DIRS"

          DIRS=$(echo "$DIRS" | xargs)
          if [ -z "$DIRS" ]; then
            echo "No package files changed. Skipping lint."
          else
            echo "Running g2 lint on changed directories: $DIRS"
            # UnstableOnly is informational for an overlay where packages can
            # intentionally remain ~arch indefinitely; it must not block PRs.
            g2 lint -disable-rule Md5CacheMissing,UnstableOnly $DIRS
          fi
