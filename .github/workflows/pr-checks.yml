name: PR Checks

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # Job to run static analysis (fast)
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed for commits check
      - name: Configure git remote
        run: git remote set-head origin -a

      - name: Run pkgcheck with configured repositories
        run: python3 scripts/pkgcheck_repos.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  g2-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: arran4/g2-action@98d19f25b72b1ef0b3e8222ce80c4fefc5bd5276 # v1.3
      - name: Run g2 lint on changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Compare the PR commits, not the synthetic merge checkout:
            # the latter also contains unrelated changes on main.
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" == "0000000000000000000000000000000000000000" ]; then
               BASE="HEAD~1"
            fi
          fi

          echo "Comparing $BASE to $HEAD"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Select PR-authored changes from the merge base, not unrelated
            # newer main-branch changes when the PR branch falls behind.
            CHANGED_FILES=$(git diff --name-only "$BASE...$HEAD")
          else
            CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")
          fi

          # Extract unique package directories (e.g., category/package)
          DIRS=$(echo "$CHANGED_FILES" | grep -E "^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+/" | cut -d/ -f1,2 | sort -u | tr '\n' ' ' || true)
          EXISTING_DIRS=""
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              EXISTING_DIRS="$EXISTING_DIRS $dir"
            fi
          done
          DIRS="$EXISTING_DIRS"

          DIRS=$(echo "$DIRS" | xargs)
          if [ -z "$DIRS" ]; then
            echo "No package files changed. Skipping lint."
          else
            echo "Running g2 lint on changed directories: $DIRS"
            # UnstableOnly is informational for an overlay where packages can
            # intentionally remain ~arch indefinitely; it must not block PRs.
            # Match updater gating: preserve warning output, fail on real errors.
            g2 lint -fail-severity error -disable-rule Md5CacheMissing,UnstableOnly $DIRS
          fi

          # The published g2 binary must continue to accept Cargo-generated
          # distfiles from net-im/msm (g2 #584). Package changes already lint
          # their directory above; recheck this regression when the action's
          # installation path or lint workflow changes, without adding CI cost
          # to unrelated package PRs.
          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq '.github/workflows/pr-checks.yml' &&
              ! printf ' %s ' "$DIRS" | grep -Fq ' net-im/msm '; then
            echo "Regression: released g2 lint of net-im/msm"
            g2 lint -fail-severity error -disable-rule Md5CacheMissing,UnstableOnly net-im/msm
          fi
