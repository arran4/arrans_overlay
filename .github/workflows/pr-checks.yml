name: PR Checks

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # Job to run static analysis (fast)
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for commits check
      - name: Configure git remote
        run: git remote set-head origin -a
      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --keywords=-UnknownManifest,-NonexistentDeps,-NonsolvableDepsInDev,-NonsolvableDepsInStable,-NonsolvableDeps,-StaticSrcUri,-MissingRemoteId,-DoubleEmptyLine --commits

  g2-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arran4/g2-action@v1.2
      - name: Run g2 lint on changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" == "0000000000000000000000000000000000000000" ]; then
               BASE="HEAD~1"
            fi
          fi

          echo "Comparing $BASE to $HEAD"
          CHANGED_FILES=$(git diff --name-only $BASE $HEAD || true)

          # Extract unique package directories (e.g., category/package)
          DIRS=$(echo "$CHANGED_FILES" | grep -E "^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+/" | cut -d/ -f1,2 | sort -u | tr '\n' ' ' || true)
          EXISTING_DIRS=""
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              EXISTING_DIRS="$EXISTING_DIRS $dir"
            fi
          done
          DIRS="$EXISTING_DIRS"

          DIRS=$(echo "$DIRS" | xargs)
          if [ -z "$DIRS" ]; then
            echo "No package files changed. Skipping lint."
          else
            echo "Running g2 lint on changed directories: $DIRS"
            g2 lint -disable-rule Md5CacheMissing $DIRS
          fi
