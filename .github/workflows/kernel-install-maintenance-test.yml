name: Kernel Install Maintenance Hooks

on:
  pull_request:
    paths:
      - 'sys-kernel/kernel-install-maintenance/**'
      - '.github/workflows/kernel-install-maintenance-test.yml'
  push:
    branches: [main]
    paths:
      - 'sys-kernel/kernel-install-maintenance/**'
      - '.github/workflows/kernel-install-maintenance-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Exercise recovery and mount guard
        run: |
          cd sys-kernel/kernel-install-maintenance/files
          bash -n 00-00-maintenance-mount.install
          bash -n 95-maintenance-recovery.install
          bash -n test-hooks.sh
          bash test-hooks.sh .
