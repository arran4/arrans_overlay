name: Verify Manifests

permissions:
  contents: write
  pull-requests: write

on:
  push:
    paths:
      - '**/Manifest'
      - '.github/workflows/verify-manifests.yml'
      - 'scripts/verify_manifest.py'
      - 'scripts/test_verify_manifest.py'
      - 'scripts/changed_manifest_dirs.py'
      - 'scripts/test_changed_manifest_dirs.py'
      - 'scripts/restore_manifests.sh'
      - 'scripts/test_manifest_restore.sh'
  pull_request:
    paths:
      - '**/Manifest'
      - '.github/workflows/verify-manifests.yml'
      - 'scripts/verify_manifest.py'
      - 'scripts/test_verify_manifest.py'
      - 'scripts/changed_manifest_dirs.py'
      - 'scripts/test_changed_manifest_dirs.py'
      - 'scripts/restore_manifests.sh'
      - 'scripts/test_manifest_restore.sh'

jobs:
  verify-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install g2
        uses: arran4/g2-action@v1.2

      - name: Identify changed Manifests
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare PR-authored changes from the merge base, not unrelated
            # files updated on main since this PR branched.
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            DIFF_MODE=(--three-dot)
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            DIFF_MODE=()
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          else
            HEAD="${{ github.sha }}"
            BASE="origin/${{ github.event.repository.default_branch }}"
            DIFF_MODE=(--three-dot)
          fi

          echo "Comparing $BASE to $HEAD"
          # Select only existing package Manifests, dynamically. Fully removed
          # packages are ignored; deleted Manifests with retained ebuilds fail.
          DIRS=$(python3 scripts/changed_manifest_dirs.py "$BASE" "$HEAD" "${DIFF_MODE[@]}")
          echo "Selected package directories: ${DIRS:-none}"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Verify Manifests
        id: verify
        if: steps.changed-files.outputs.dirs != ''
        run: |
          python3 scripts/verify_manifest.py ${{ steps.changed-files.outputs.dirs }}

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "summary<<$EOF" >> "$GITHUB_OUTPUT"
          git diff --stat >> "$GITHUB_OUTPUT" || true
          echo "$EOF" >> "$GITHUB_OUTPUT"

          echo "details<<$EOF" >> "$GITHUB_OUTPUT"
          git diff | head -c 60000 >> "$GITHUB_OUTPUT" || true
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: update Manifest files"
          title: "fix: update Manifest files"
          body: |
            Manifest files were verified and updated using `g2`.

            ### Summary of Changes
            ```text
            ${{ steps.verify.outputs.summary }}
            ```

            <details>
            <summary>Detailed diff</summary>

            ```diff
            ${{ steps.verify.outputs.details }}
            ```
            </details>

            This PR is auto-generated by the [Verify Manifests] workflow.
          branch: fix/manifest-updates
          delete-branch: true
          base: ${{ github.head_ref || github.ref_name }}
          assignees: arran4

      - name: Close superseded pull request
        if: >-
          github.event_name == 'pull_request' &&
          steps.create-pull-request.outputs.pull-request-number != '' &&
          steps.create-pull-request.outputs.pull-request-number != github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_PR: ${{ github.event.pull_request.number }}
          REPLACEMENT_PR: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          gh pr close "$OLD_PR" --comment "Superseded by #${REPLACEMENT_PR}."
